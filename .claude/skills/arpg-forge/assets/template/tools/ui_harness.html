<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UI harness</title>
  <style>
    html, body { margin: 0; background: #0a0a0c; }
    #game { display: block; background: #000; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "/src/items/inventory.js": "/tools/ui_stubs/inventory.js",
      "/src/items/itemgen.js": "/tools/ui_stubs/itemgen.js",
      "/src/skills/skills.js": "/tools/ui_stubs/skills.js",
      "/src/npc/npcs.js": "/tools/ui_stubs/npcs.js",
      "/src/quests/quests.js": "/tools/ui_stubs/quests.js",
      "/src/entities/player.js": "/tools/ui_stubs/player.js",
      "/src/entities/combat.js": "/tools/ui_stubs/combat.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>
  <script type="module">
    import { createCamera } from '/src/render/camera.js';
    import { renderWorld } from '/src/render/iso.js';
    import { createBus } from '/src/core/events.js';
    import { createRng } from '/src/core/rng.js';
    import { createTiles, fillRect, T, idx } from '/src/world/tiles.js';
    import { createLightMap } from '/src/world/fov.js';
    import { renderUi, updateUi, uiHandleClick, uiHandleKey, uiHitTest, uiLayout, openVendor, addMessage, addFloat } from '/src/render/ui.js';

    const W = 960, H = 540;
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const rng = createRng(4242);

    /* ---- theme ---- */
    const theme = {
      meta: { id: 'default', title: 'Hollow Vigil', tagline: 'Something stirs beneath the watch-town.', version: '0.1' },
      palette: {
        bg: '#0a0a0c', panel: '#1b1a1f', panelBorder: '#6e5a3a', text: '#e8e0cc', textDim: '#8d867a', accent: '#7fb7ff',
        hp: '#b8232f', mp: '#2b58c7', xp: '#c9a24a', gold: '#e9c24a',
        rarity: { normal: '#e8e0cc', magic: '#7fb7ff', rare: '#f0e35a', unique: '#d9a441' },
        danger: '#e04545', good: '#67d36a', light: '#ffd27a', font: '14px system-ui, sans-serif',
      },
      strings: {},
      town: { name: 'Hollow Vigil' },
      tiers: [{ id: 't1', name: 'The Undercroft', depths: [1, 4] }],
      classes: [
        { id: 'warden', name: 'Warden', blurb: 'Shield and steel. Holds the line where others break.', base: { str: 30, mag: 10, dex: 20, vit: 25 }, max: { str: 250, mag: 50, dex: 60, vit: 100 }, look: { silhouette: 'bulky', bodyColor: '#8a6a3a', trimColor: '#c9b48a' } },
        { id: 'stalker', name: 'Stalker', blurb: 'Quick feet and a long bow. Ends fights before they start.', base: { str: 20, mag: 15, dex: 30, vit: 20 }, max: { str: 55, mag: 70, dex: 250, vit: 80 }, look: { silhouette: 'lean', bodyColor: '#3f6a4a', trimColor: '#b8c59a' } },
        { id: 'hexwright', name: 'Hexwright', blurb: 'Bends the old wards to burn, freeze and shatter.', base: { str: 15, mag: 35, dex: 15, vit: 20 }, max: { str: 45, mag: 250, dex: 85, vit: 80 }, look: { silhouette: 'robed', bodyColor: '#4a3a6a', trimColor: '#c9a6ff' } },
      ],
      skills: [
        { id: 'firebolt', name: 'Firebolt', blurb: 'A bolt of flame.', archetype: 'bolt', element: 'fire', manaBase: 6, manaPerLevel: 1, manaMin: 3, dmg: { base: [2, 6] }, look: { color: '#ff7a3c', glyph: 'F' } },
        { id: 'frost_shard', name: 'Frost Shard', blurb: 'A shard of ice that slows.', archetype: 'bolt', element: 'cold', manaBase: 7, manaPerLevel: 1, manaMin: 3, dmg: { base: [1, 5] }, look: { color: '#7ad7ff', glyph: 'S' } },
        { id: 'arc_lance', name: 'Arc Lance', blurb: 'A piercing lance of lightning.', archetype: 'pierce', element: 'shock', manaBase: 10, manaPerLevel: 1, manaMin: 5, dmg: { base: [1, 12] }, look: { color: '#ffe66d', glyph: 'A' } },
        { id: 'mend', name: 'Mend', blurb: 'Knit flesh and bone.', archetype: 'heal', element: 'arcane', manaBase: 8, manaPerLevel: 1, manaMin: 4, dmg: { base: [4, 8] }, look: { color: '#67d36a', glyph: 'M' } },
        { id: 'stone_skin', name: 'Stone Skin', blurb: 'Harden your skin for a time.', archetype: 'buff', element: 'arcane', manaBase: 12, manaPerLevel: 2, manaMin: 6, look: { color: '#a89f91', glyph: 'K' } },
        { id: 'blink', name: 'Blink', blurb: 'Step through the dark.', archetype: 'blink', element: 'arcane', manaBase: 15, manaPerLevel: 1, manaMin: 8, look: { color: '#c98bff', glyph: 'B' } },
        { id: 'nova', name: 'Nova', blurb: 'A ring of lightning.', archetype: 'nova', element: 'shock', manaBase: 30, manaPerLevel: 2, manaMin: 15, dmg: { base: [5, 20] }, look: { color: '#ffe66d', glyph: 'N' } },
        { id: 'return_home', name: 'Return Home', blurb: 'Open a portal to town.', archetype: 'townPortal', element: 'arcane', manaBase: 20, manaPerLevel: 0, manaMin: 20, look: { color: '#7fb7ff', glyph: 'H' } },
      ],
      quests: [],
      flavor: {
        deathLines: ['The watch will light a candle for you. Briefly.', 'Something below is still hungry.'],
        loadingTips: ['Hold Alt to see every item on the ground.', 'Shift-click a stat button to spend all your points.'],
        outro: ['The Vessel of Ash is broken and the Ember Vault lies cold.', 'Hollow Vigil sleeps, for now.'],
        levelName: (depth, tier) => `${tier} ${depth}`,
      },
    };

    /* ---- items ---- */
    let nextId = 100;
    function item(baseId, name, slot, type, w, h, glyph, color, extra = {}) {
      return {
        id: nextId++, baseId, name, slot, type, size: { w, h }, quality: 'normal', identified: true, level: 5,
        req: {}, dmg: null, ac: null, dur: null, affixes: [], unique: null, effects: {}, charges: null, count: 1,
        price: { buy: 120, sell: 30 }, look: { glyph, color }, seed: 1, ...extra,
      };
    }
    const potion = (n, color, glyph = 'flask') => item(`c_${n}`, `${n} potion`, 'consumable', 'potion', 1, 1, glyph, color, { price: { buy: 50, sell: 12 } });
    const inventoryItems = [
      item('longblade', 'Longblade of the Fox', 'weapon', 'sword', 2, 3, 'blade', '#cfd4da', { quality: 'magic', dmg: { min: 4, max: 12 }, dur: { cur: 30, max: 40 }, req: { str: 25 }, affixes: [{ id: 'p_fox', name: '+15% to hit' }], effects: { toHit: 15 }, price: { buy: 850, sell: 212 } }),
      item('war_bow', 'War Bow', 'weapon', 'bow', 2, 3, 'bow', '#8a6a3a', { dmg: { min: 3, max: 10 }, req: { dex: 45, str: 30 }, dur: { cur: 20, max: 20 } }),
      item('kite_shield', 'Kite Shield', 'offhand', 'shield', 2, 3, 'shield', '#6a7a8a', { ac: 9, dur: { cur: 10, max: 32 }, req: { str: 40 } }),
      item('iron_helm', 'Iron Helm', 'head', 'helm', 2, 2, 'helm', '#9aa0a6', { ac: 6, dur: { cur: 18, max: 20 } }),
      item('ring', 'Ring of the Watch', 'ring', 'ring', 1, 1, 'ring', '#d9a441', { quality: 'unique', unique: 'uq_ring_of_the_watch', affixes: [{ id: 'u1', name: '+10 to all stats' }, { id: 'u2', name: 'Resist all +15%' }], price: { buy: 4000, sell: 1000 } }),
      item('amulet', 'Amulet', 'amulet', 'amulet', 1, 1, 'amulet', '#7fb7ff', { quality: 'rare', identified: false }),
      item('c_tome_blink', 'Tome of Blink', 'tome', 'tome', 1, 1, 'book', '#c98bff', { price: { buy: 1200, sell: 300 } }),
      item('c_scroll_portal', 'Scroll of Return', 'scroll', 'scroll', 1, 1, 'scroll', '#e8e0cc', { count: 3 }),
      potion('heal', '#d03030'), potion('mana', '#3050d0'), potion('rejuv', '#b050c0'),
      item('wand', 'Wand', 'weapon', 'wand', 1, 2, 'wand', '#c9a6ff', { dmg: { min: 1, max: 4 }, charges: { cur: 12, max: 20 } }),
    ];
    const inv = { w: 10, h: 4, cells: new Int32Array(40), items: {} };
    function place(it, cx, cy) {
      for (let y = cy; y < cy + it.size.h; y++) for (let x = cx; x < cx + it.size.w; x++) inv.cells[y * 10 + x] = it.id;
      inv.items[it.id] = it;
    }
    place(inventoryItems[0], 0, 0); place(inventoryItems[1], 2, 0); place(inventoryItems[2], 4, 0); place(inventoryItems[3], 6, 0);
    place(inventoryItems[4], 8, 0); place(inventoryItems[5], 9, 0); place(inventoryItems[6], 8, 1); place(inventoryItems[7], 9, 1);
    place(inventoryItems[8], 6, 2); place(inventoryItems[9], 7, 2); place(inventoryItems[10], 6, 3); place(inventoryItems[11], 8, 2);

    const equipment = {
      head: item('cap', 'Leather Cap', 'head', 'helm', 2, 2, 'helm', '#8a6a3a', { ac: 3, dur: { cur: 10, max: 12 } }),
      body: item('studded_coat', 'Studded Coat of Warding', 'body', 'armor', 2, 3, 'chest', '#6a5a4a', { quality: 'magic', ac: 14, effects: { resFire: 20, ac: 5 }, affixes: [{ id: 'sw', name: 'Resist fire +20%' }], dur: { cur: 30, max: 36 } }),
      weapon: item('hatchet', 'Hatchet', 'weapon', 'axe', 2, 3, 'axe', '#9aa0a6', { dmg: { min: 2, max: 8 }, dur: { cur: 15, max: 24 } }),
      offhand: null, ring1: null, ring2: null, amulet: null,
    };

    /* ---- player ---- */
    const player = {
      id: 1, kind: 'player', tx: 12, ty: 12, ox: 0, oy: 0, dir: 3, anim: 'stand', frame: 0, frameTicks: 4, frameAcc: 0, path: null,
      hp: 61, hpMax: 92, dead: false, look: { silhouette: 'bulky', bodyColor: '#8a6a3a', trimColor: '#c9b48a' }, flash: 0,
      classId: 'warden', name: 'Brannoc', level: 7, xp: 3400, statPoints: 5,
      base: { str: 42, mag: 12, dex: 24, vit: 31 }, bonus: { str: 0, mag: 0, dex: -3, vit: 4 },
      mp: 18, mpMax: 40, gold: 2375,
      resist: { fire: 20, cold: 0, shock: 75, arcane: 10 },
      derived: { toHit: 68, ac: 31, dmgMin: 4, dmgMax: 11, blockChance: 12, lifeFromItems: 0, manaFromItems: 0 },
      equipment, inventory: inv,
      belt: [potion('heal', '#d03030'), potion('heal', '#d03030'), potion('mana', '#3050d0'), null, potion('rejuv', '#b050c0'), null, null, null],
      skills: { firebolt: 3, frost_shard: 1, mend: 2, stone_skin: 1, blink: 1 },
      selectedSkill: 'firebolt', hotkeys: ['firebolt', 'mend', null, 'blink'],
      state: { hitRecoverTicks: 0, invulnTicks: 0, manaShield: 0, buffs: [] },
      intent: null,
    };
    player.belt[0].count = 3;
    player.belt[2].count = 2;

    /* ---- level ---- */
    const LW = 48, LH = 48;
    const tiles = createTiles(LW, LH);
    const rooms = [[4, 4, 14, 12], [20, 6, 12, 10], [8, 20, 10, 12], [22, 20, 18, 14], [30, 2, 12, 10]];
    for (const [x, y, w, h] of rooms) fillRect(tiles, x, y, w, h, { floor: 1 });
    fillRect(tiles, 17, 9, 4, 2, { floor: 2 }); fillRect(tiles, 11, 15, 2, 6, { floor: 2 }); fillRect(tiles, 17, 24, 6, 2, { floor: 2 }); fillRect(tiles, 31, 11, 3, 10, { floor: 2 });
    for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
      const i = idx(tiles, x, y);
      if (tiles.floor[i]) continue;
      let near = false;
      for (let dy = -1; dy <= 1 && !near; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < LW && ny < LH && tiles.floor[idx(tiles, nx, ny)]) { near = true; break; }
      }
      if (near) { tiles.wall[i] = 1; tiles.flags[i] |= T.SOLID | T.BLOCKS_LIGHT; }
    }
    tiles.flags[idx(tiles, 18, 9)] |= T.DOOR;
    const lightMap = createLightMap(tiles);
    for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
      const d = Math.hypot(x - 12, y - 12);
      if (d < 14 + rng.float() * 6) lightMap.explored[idx(tiles, x, y)] = 1;
    }
    lightMap.update([{ x: 12, y: 12, r: 8 }]);
    const monster = {
      id: 2, kind: 'monster', typeId: 'shambler', name: 'Shambler', level: 3, tx: 15, ty: 10, ox: 0, oy: 0, dir: 1, anim: 'stand', frame: 0,
      hp: 23, hpMax: 40, dead: false, look: { silhouette: 'bulky', bodyColor: '#5a6a4a', trimColor: '#2a2a2a' }, flags: new Set(['undead']), immune: new Set(),
    };
    const npc = {
      id: 3, kind: 'npc', npcId: 'n_brann', name: 'Brann', title: 'the smith', role: 'smith', tx: 9, ty: 9, ox: 0, oy: 0, dir: 0, anim: 'stand', frame: 0,
      hp: 1, hpMax: 1, dead: false, look: { silhouette: 'bulky', bodyColor: '#6a4a3a', trimColor: '#e0c090' }, services: ['repair', 'heal'],
      greeting: ['Steel wants tending, same as men. What do you need?'],
      stock: [
        item('shortblade', 'Shortblade', 'weapon', 'sword', 1, 3, 'blade', '#cfd4da', { dmg: { min: 2, max: 6 }, price: { buy: 90, sell: 22 } }),
        item('war_axe', 'War Axe of Slaughter', 'weapon', 'axe', 2, 3, 'axe', '#9aa0a6', { quality: 'rare', dmg: { min: 6, max: 14 }, req: { str: 60 }, price: { buy: 3200, sell: 800 } }),
        item('chain_hauberk', 'Chain Hauberk', 'body', 'armor', 2, 3, 'chest', '#9aa0a6', { ac: 20, req: { str: 45 }, price: { buy: 1500, sell: 375 } }),
        item('buckler', 'Buckler', 'offhand', 'shield', 2, 2, 'shield', '#8a6a3a', { ac: 4, price: { buy: 140, sell: 35 } }),
        item('cap', 'Cap', 'head', 'helm', 2, 2, 'helm', '#8a6a3a', { ac: 2, price: { buy: 60, sell: 15 } }),
        item('tower_shield', 'Tower Shield', 'offhand', 'shield', 2, 3, 'shield', '#6a7a8a', { ac: 14, req: { str: 70 }, price: { buy: 2600, sell: 650 } }),
      ],
    };
    const groundItems = [
      Object.assign(item('gold', 'Gold', 'gold', 'gold', 1, 1, 'coin', '#e9c24a', { count: 134 }), { tx: 13, ty: 13, dropTick: 0 }),
      Object.assign(item('cudgel', 'Cudgel', 'weapon', 'mace', 1, 3, 'mace', '#8a6a3a'), { tx: 13, ty: 13, dropTick: 0 }),
      Object.assign(item('ring', 'Ring', 'ring', 'ring', 1, 1, 'ring', '#7fb7ff', { quality: 'magic' }), { tx: 14, ty: 13, dropTick: 0 }),
      Object.assign(potion('heal', '#d03030'), { tx: 10, ty: 14, dropTick: 0 }),
    ];
    const level = {
      depth: 2, tier: 0, tilesetId: 'undercroft', tiles, light: lightMap.light, explored: lightMap.explored, lightMap,
      occupant: new Int32Array(LW * LH), monsters: [monster], objects: [], items: groundItems, missiles: [], npcs: [npc],
      stairs: { up: { x: 6, y: 6 }, down: { x: 24, y: 28 }, town: null }, entry: { x: 12, y: 12 }, rooms: [], seed: 1, visited: true, cleared: false, portal: null,
    };

    /* ---- game ---- */
    const camera = createCamera(W, H);
    const input = { mouse: { x: -1, y: -1, down: false, rightDown: false, inside: false }, keys: new Set(), isDown: (k) => input.keys.has(k) };
    const game = {
      seed: 12345, tick: 300, mode: 'dungeon', rng, theme, balance: { maxLevel: 50 }, strings: theme.strings,
      level, town: null, player, quests: {}, ui: {}, camera, input, audio: { muted: false, play() {} }, bus: createBus(), nextId: 10,
      stats: { kills: 42, deaths: 0, gold: 0, deepest: 2, playTicks: 300 }, debug: {}, renderAlpha: 1, hooks: { menuAction(g, a) { g.__lastAction = a; return true; } },
      canvas, ctx,
    };
    camera.follow(player, 1);

    function frame() {
      ctx.fillStyle = theme.palette.bg;
      ctx.fillRect(0, 0, W, H);
      renderWorld(ctx, game);
      renderUi(ctx, game);
    }
    function render(n = 2) {
      // two passes: the first fills the hit registry, the second computes hover against it
      for (let i = 0; i < n; i++) { updateUi(game); frame(); }
    }
    function reset() {
      game.mode = 'dungeon';
      const ui = game.ui;
      ui.left = null; ui.right = null; ui.vendor = null; ui.dialogue = null; ui.automap = false; ui.menuOpen = false; ui.open = null;
      ui.cursorItem = null; ui.loading = null; ui.vendorMsg = null; ui.deathLine = null;
      ui.messages = []; ui.floats = [];
      input.mouse.x = -1; input.mouse.y = -1; input.mouse.inside = false; input.keys.clear();
    }
    function setMouse(x, y) { input.mouse.x = x; input.mouse.y = y; input.mouse.inside = true; }
    const STATES = {
      hud() {
        addMessage(game, 'You enter The Undercroft 2.', theme.palette.text);
        addMessage(game, 'Picked up 134 gold.', theme.palette.gold);
        addMessage(game, 'Quest updated: The Thing Below', theme.palette.accent);
        addFloat(game, { x: 15.5, y: 10.5, text: 17, element: 'fire' });
        addFloat(game, { x: 15.5, y: 10.5, text: 8, element: 'fire' });
        addFloat(game, { x: 12.5, y: 12.5, text: 6, element: 'playerHit' });
        game.ui.lastHitMonster = { id: 2, tick: game.tick };
        input.keys.add('Alt');
        setMouse(uiLayout.leftButtons.x + 10, uiLayout.leftButtons.y + 10);
      },
      inventory() {
        uiHandleKey(game, 'i');
        const r = uiLayout.rightPanel;
        setMouse(r.x + uiLayout.inventory.grid.x + 14, r.y + uiLayout.inventory.grid.y + 14);
      },
      'inventory-cursor'() {
        uiHandleKey(game, 'i');
        game.ui.cursorItem = Object.assign(item('great_helm', 'Great Helm', 'head', 'helm', 2, 2, 'helm', '#cfd4da', { ac: 10 }));
        const r = uiLayout.rightPanel;
        setMouse(r.x + uiLayout.inventory.grid.x + 29 * 2 + 14, r.y + uiLayout.inventory.grid.y + 29 * 2 + 14);
      },
      character() { uiHandleKey(game, 'c'); setMouse(uiLayout.leftPanel.x + uiLayout.character.plusX + 5, uiLayout.leftPanel.y + 140); },
      skills() { uiHandleKey(game, 's'); setMouse(uiLayout.leftPanel.x + 100, uiLayout.leftPanel.y + uiLayout.skills.rowY + uiLayout.skills.rowH * 1.5); },
      quests() { uiHandleKey(game, 'q'); },
      automap() { uiHandleKey(game, 'Tab'); },
      'vendor-buy'() { openVendor(game, npc); setMouse(100, 140); },
      'vendor-services'() { openVendor(game, npc); game.ui.vendorTab = 'services'; },
      dialogue() {
        game.ui.dialogue = { npc: npc, lines: npc.greeting.concat(['I can mend what the deep has chewed, for a price.']), options: [
          { label: 'Trade', action: (g) => openVendor(g, npc) }, { label: 'Repair my gear', action: () => {} }, { label: 'Farewell' },
        ] };
      },
      'main-menu'() { game.mode = 'menu'; game.ui.menu = { classIndex: 1, name: 'Brannoc', seed: '12345', focus: 'name' }; },
      death() { game.mode = 'dead'; setMouse(480, 315); },
      win() { game.mode = 'win'; },
      menu() { uiHandleKey(game, 'Escape'); },
      loading() { game.ui.loading = { text: 'Carving The Undercroft 3', progress: 0.6 }; },
      both() { uiHandleKey(game, 'i'); uiHandleKey(game, 'c'); },
    };
    function setState(name) {
      reset();
      render(1);
      if (!STATES[name]) throw new Error(`unknown state ${name}`);
      STATES[name]();
      render(2);
      return name;
    }
    window.__ui = {
      game, uiLayout, render, reset, setState, setMouse, states: Object.keys(STATES),
      hitTest: (x, y) => { const h = uiHitTest(game, x, y); return h ? { ...h, item: h.item ? h.item.name : h.item, rect: undefined } : null; },
      click: (x, y, button = 0, mods = {}) => { const c = uiHandleClick(game, x, y, button, mods); render(2); return c; },
      key: (k) => { const c = uiHandleKey(game, k); render(2); return c; },
      cursorItemName: () => (game.ui.cursorItem ? game.ui.cursorItem.name : null),
      cellId: (cx, cy) => inv.cells[cy * 10 + cx],
      itemCount: () => Object.keys(inv.items).length,
    };
    setState('hud');
  </script>
</body>
</html>
